name: Release and production

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: ${{ vars.RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Create release PR or GitHub release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          target-branch: main

      - name: Request release PR review
        if: ${{ steps.release.outputs.prs_created == 'true' && vars.RELEASE_REVIEWER != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ fromJSON(steps.release.outputs.pr || '{}').number }}
          RELEASE_REVIEWER: ${{ vars.RELEASE_REVIEWER }}
        run: gh pr edit "$PR_NUMBER" --add-reviewer "$RELEASE_REVIEWER"

  production:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' && vars.RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout released candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Static checks
        run: bun run staticchecks

      - name: Set up EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385
        with:
          eas-version: latest
          packager: bun
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build and submit production candidates
        run: bun run prod --non-interactive --no-wait
